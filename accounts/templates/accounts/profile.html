<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile | TruckLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-md overflow-hidden border border-slate-200">
        <div class="bg-slate-900 px-6 py-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">My Profile</h1>
                <p class="text-slate-400 text-xs mt-0.5">Manage your TruckLink account details</p>
            </div>
            <a href="{% url 'logout' %}" class="bg-red-600/80 hover:bg-red-600 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Logout</a>
        </div>

        <div class="p-6">
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">First Name</label>
                        <input type="text" name="first_name" value="{{ request.user.first_name }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Last Name</label>
                        <input type="text" name="last_name" value="{{ request.user.last_name }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
                    <input type="email" name="email" value="{{ request.user.email }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Role (Assigned)</label>
                    <input type="text" disabled value="{{ profile.get_role_display }}" class="w-full px-3 py-2 border border-slate-200 bg-slate-50 text-slate-500 rounded-lg text-sm cursor-not-allowed">
                </div>

                {{ profile_form.as_p }}

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition duration-200 shadow-md shadow-blue-500/20 mt-4">
                    Save Changes
                </button>
            </form>
        </div>
    </div>
</body>
</html>
