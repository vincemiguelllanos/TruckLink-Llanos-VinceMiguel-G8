<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dispatcher Dashboard | TruckLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold">🚚 TruckLink — Dispatcher Portal</h1>
        <div class="flex items-center gap-4">
            <a href="{% url 'profile' %}" class="text-sm text-slate-300 hover:text-white">Profile</a>
            <a href="{% url 'logout' %}" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded-lg font-semibold transition">Logout</a>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-slate-800">Welcome, Dispatcher {{ request.user.username }}!</h2>
            <p class="text-slate-500 text-sm mt-1">Manage fleet routes, assign trucks, and track shipments here.</p>
        </div>
    </main>
</body>
</html>
